<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28">
  <defs>
    <linearGradient id="spinnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1E293B" stroke-width="8" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#spinnerGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="180 80">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="0.9s" repeatCount="indefinite" />
  </circle>
</svg>
