<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 12" width="400" height="12" style="border-radius: 6px; overflow: hidden;">
  <defs>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
      <animate attributeName="x1" from="-100%" to="100%" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="1.6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <rect width="400" height="12" fill="#0F172A" rx="6" />
  <rect width="400" height="12" fill="url(#shimmer)" rx="6" opacity="0.95" />
</svg>
